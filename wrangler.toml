name = "eliannys-wa-agent"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# webhook en dominio propio → https://chat.eliannys.com/webhook
# (requiere eliannys.com gestionado en Cloudflare; custom_domain crea DNS + cert)
routes = [{ pattern = "chat.eliannys.com", custom_domain = true }]

# prompts como módulos de texto (no hay filesystem en Workers)
rules = [{ type = "Text", globs = ["prompts/**/*.md"] }]

[[d1_databases]]
binding = "DB"
database_name = "eliannys-wa-agent"
database_id = "b6b6d8a9-ddc4-4dc5-9487-8987e0afd297"
migrations_dir = "migrations"

[vars]
LLM_PROVIDER = "deepseek"
GRAPH_API_VERSION = "v26.0"
SHOP_API_BASE_URL = "https://eliannys.com/api/v1"
USE_D1 = "1"
